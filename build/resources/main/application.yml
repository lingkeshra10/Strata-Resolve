spring:
  application:
    name: strataresolve

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  file-storage:
    base-path: ${FILE_STORAGE_PATH:./uploads}
    max-file-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    ticket-submissions:
      max-per-period: 10
      period-minutes: 60
  ticket:
    reopen-window-hours: 72
    rate-limit:
      max-submissions-per-period: 10
      period-minutes: 60
    duplicate-detection:
      time-window-hours: 48
      similarity-threshold: 0.6
  notification:
    max-retry-attempts: 5
    poll-interval-ms: 30000
    from-address: ${NOTIFICATION_FROM_ADDRESS:noreply@strataresolve.com}
  sla:
    monitor:
      poll-interval-ms: 60000
